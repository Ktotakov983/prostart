plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.ktotakov983.startgun'
    compileSdk 34

    defaultConfig {
        // Different id from the first StartGun, so both can be installed side by
        // side and the old app's history isn't lost before it is exported.
        applicationId 'io.github.ktotakov983.startgun2'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger() + 1)
        versionName '2.0'
    }

    signingConfigs {
        release {
            // The key lives only in the repository secrets; the CI workflow
            // decodes it to a temp file and passes these variables. Same key
            // every build, so a new APK installs as an update.
            storeFile file(System.getenv('STARTGUN_KEYSTORE') ?: 'missing-keystore.p12')
            storeType 'pkcs12'
            storePassword System.getenv('STARTGUN_KEYSTORE_PASSWORD')
            keyAlias System.getenv('STARTGUN_KEY_ALIAS')
            keyPassword System.getenv('STARTGUN_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
